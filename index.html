<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/culturama-favico.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
    <title> Pesquisa Culturama</title>
</head>
<body>
    <main>
<header>
        <img src="img/logo-culturama.png" alt="Culturama-Logo">
    <h1>Pesquisa de Opinião</h1>
    </header>
<section>
    <!--DADOS PESSOAIS -->
<form action="sucess.html" method="get">
    <fieldset>
<legend>Dados Pessoais✏️</legend>
    <label for="name">Nome</label>
    <input id="name" type="text" name="UserName" required>
    <br>
    <label for="userAge">Idade</label>
    <input id="userAge" type="text" name="userAge" min="12" max="110" required>
    <br>
    <label for="Birthdate">Data de Nascimento</label>
    <input id="Birthdate" type="date" name="Birthdate" required>
    <br>
    <label for="email">Email</label>
    <input id="email" type="email" name="userEmail" required>
    <br>
    <label for="TEL">Telefone</label>
    <input id="TEL" type="tel" name="UserNumberPhone" pattern="[0-9]{11}"placeholder="DDD+número" required aria-describedby="PhoneHelp">
    <small id="PhoneHelp">Prencher com 11 digítos no formato: DDD+Número sem espaços ou hífen.</small>
    <br>
    <label for="userImage">Upload de Foto</label>
    <input id="userImage" type="file" accept="image/*" name="userImage">
    <br>
    </fieldset>
<!--PERFIL -->
<fieldset>
    <legend>Perfil🧑‍🧒</legend>
    <!--Genero -->
<p1>Genêro:</p1>
    <input id="genderfemea" type="radio" name="UserGender" value="Feminino">
    <label for="genderfemea">Feminino</label>

    <input id="gendermale" type="radio" name="UserGender" value="Masculino">
    <label for="gendermale">Masculino</label>

    <input id="gender" type="radio" name="UserGender" value="NotInformed">
    <label for="gender">Prefiro não informar</label>
    <br>
<!--Estado Civil -->
    <label for="MaritalStatus">Estado Civil</label>
    <select id="MaritalStatus" name="MaritalStatus">
    <option value="NotInformed">Selecione... </option>
    <option value="Casado">Casado(a)</option>
    <option value="Solteiro">Solteiro(a)</option>
    <option value="Divorciado">Divorciado(a)</option>
    <option value="Viuvo">Viuvo(a)</option>
    <option value="UniaoEstavel">União Estavel</option>
    <!--Localidade -->
</select>
<br>
<label for="Location">Estado</label >
    <select id="Location" name="Location" required>
            <option value="Select">Selecione...</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espirito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MT">Mato Grosso</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
</select>
<br>
<label for="city">Cidade</label>
    <input id="city" type="text" name="Cidade" required>
</fieldset>
                <!--HABITOS-->
<fieldset>
    <legend>Hábitos🎭</legend>
        <p>Redes Sociais</p>
    <input id="insta" type="checkbox" name="socials" value="Instagram">
    <label for="insta">Instagram</label>
    <br>
<input id="face" type="checkbox" name="socials" value="Facebook">
    <label for="face">Facebook</label>
    <br>
    <input id="ttk" type="checkbox" name="socials" value="Tiktok">
    <label for="ttk">Tiktok</label>
<br>
    <input id="linkedin" type="checkbox" name="socials" value="LinkedIn">
    <label for="linkedin">LinkedIn</label>
    <br>
        <input id="twitter" type="checkbox" name="socials" value="X">
    <label for="twitter">X</label>
    <br>
        <input id="Kwai" type="checkbox" name="socials" value="Kwai">
    <label for="Kwai">Kwai</label>
    <br>
        <input id="youtube" type="checkbox" name="socials" value="YouTube">
    <label for="youtube">YouTube</label>
<br>
    <label for="MusicStyle">Estilo Musical</label>
    <input list="Styletypes" id="MusicStyle" type="text" required>
    <datalist id="Styletypes">
<option value="Rock">
    <option value="Funk">
        <option value="Pop">
            <option value="Samba">
                <option value="Pagode">
                    <option value="Sertanejo">
                        <option value="Eletrônica"></option>
    </datalist>
    <br>
    <label for="Color">Cor Favorita</label>
    <input type="color" name="UserFavoriteColor" id="Color">
</fieldset>
<fieldset>
    <!--PESQUISA DE SATISFAÇÃO-->
<legend>Pesquisa de Satisfação🔍</legend>
<input id="otima" type="radio" name="satisfacao" value="otima">
<label for="otima">Ótima</label>

<input id="boa" type="radio" name="satisfacao" value="boa">
<label for="boa">Boa</label>
<input id="ruim" type="radio" name="satisfacao" value="ruim">
<label for="ruim">Ruim</label>

<input id="pessima" type="radio" name="satisfacao" value="pessima">
<label for="pessima">Péssima</label>
<br>
<label for="comentario">Sua opinião é importante!</label>
<br>
<textarea 
    id="comentario" 
    name="comentario"
    rows="8" 
    cols="80" 
    placeholder="Deixe seu comentário aqui...">
</textarea>
</fieldset>
<!--CONFIRMAÇÕES DO USUÁRIO-->
<fieldset>
    <legend>Confirmações✔️</legend>

    <input type="checkbox" name="UserLGPD" id="userlgpdterm" value="accepted" required>
    <label for="userlgpdterm">Eu aceito a participar da pesquisa</label>
<br>
    <input type="checkbox" name="UserGetResult" id="useracceptedemail" value="accepted">
    <label for="useracceptedemail">Desejo receber o resultado por email</label>
</fieldset>

    <button type="submit">Enviar</button>
    <button type="reset">Limpar Dados</button>
</form>
    </section>
    </header>
    </main>
</body>
</html>
